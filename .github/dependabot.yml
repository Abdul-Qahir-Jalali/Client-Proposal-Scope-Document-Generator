# Opens a pull request when a pinned package or a GitHub Action has a newer version.
# CI then runs on that pull request, so you see whether the upgrade is safe.
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
