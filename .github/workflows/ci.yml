name: CI

# Runs on every push and every pull request. A red check means: do not merge.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, types, tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Lint (ruff)
        run: python -m ruff check .

      - name: Format check (ruff)
        run: python -m ruff format --check .

      - name: Type check (mypy)
        run: python -m mypy

      - name: Tests with coverage
        run: python -m pytest --cov --cov-report=term-missing --cov-report=xml
        env:
          LOG_FILE: none

      - name: Health check
        run: python -m proposal.health
        env:
          LOG_FILE: none

  security:
    name: Dependency vulnerability scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m pip install pip-audit==2.10.1
      - name: Check pinned packages for known vulnerabilities
        run: python -m pip_audit -r requirements.txt --no-deps --disable-pip
